# ============================================================
# 3. Build EXE Windows (Electron)
# ============================================================
# Descomprime el ZIP y genera el .exe de Windows.
# ============================================================

name: 3 - Build EXE Windows

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.18.0'

jobs:
  build-exe:
    name: Generar EXE
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        shell: bash
        run: |
          echo "Descomprimiendo nova-codemind-completo-v2.zip..."
          unzip -q nova-codemind-completo-v2.zip -d project
          ls -la project/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar dependencias
        working-directory: project
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Build estático del frontend
        working-directory: project
        shell: bash
        run: |
          pnpm build:static || pnpm exec vite build
          echo "Build terminado. Contenido de dist:"
          ls -la dist/ || true
          find dist -name "index.html" || true

      - name: Preparar estructura dist/public
        working-directory: project
        shell: bash
        run: |
          # Asegurar que existe dist/public/index.html
          if [ -f "dist/public/index.html" ]; then
            echo "OK: dist/public/index.html existe"
          elif [ -f "dist/index.html" ]; then
            echo "Moviendo dist/* a dist/public/"
            mkdir -p dist/public
            cp -r dist/* dist/public/ 2>/dev/null || true
            # Evitar recursión
            rm -rf dist/public/public 2>/dev/null || true
          else
            echo "ERROR: No se encontró index.html"
            find dist -type f | head -50
            exit 1
          fi
          ls -la dist/public/ | head -20

      - name: Instalar Electron + electron-builder
        working-directory: project
        shell: bash
        run: |
          pnpm add -D electron@33 electron-builder@25

      - name: Crear Electron main + config
        working-directory: project
        shell: bash
        run: |
          cat > electron-main.js << 'EOF'
          const { app, BrowserWindow, shell } = require('electron');
          const path = require('path');

          app.commandLine.appendSwitch('disable-features', 'OutOfBlinkCors');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 900,
              minHeight: 600,
              title: 'CodeMind Nova',
              backgroundColor: '#070817',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: true,
              },
              autoHideMenuBar: true,
            });

            const indexPath = path.join(__dirname, 'dist', 'public', 'index.html');
            win.loadFile(indexPath).catch((err) => {
              console.error('Error cargando index:', err);
              win.loadFile(path.join(__dirname, 'dist', 'index.html'));
            });

            win.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url);
              return { action: 'deny' };
            });
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          EOF

          # Actualizar package.json para electron-builder
          node << 'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.main = 'electron-main.js';
          pkg.build = {
            appId: 'com.codemind.nova',
            productName: 'CodeMind Nova',
            directories: { output: 'release' },
            files: [
              'electron-main.js',
              'dist/**/*',
              'package.json'
            ],
            win: {
              target: [
                { target: 'portable', arch: ['x64'] },
                { target: 'nsis', arch: ['x64'] }
              ],
              artifactName: 'CodeMind-Nova-${version}-${arch}.${ext}'
            },
            nsis: {
              oneClick: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true
            },
            portable: {
              artifactName: 'CodeMind-Nova-Portable.exe'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('package.json actualizado para electron-builder');
          NODE

      - name: Construir EXE
        working-directory: project
        shell: bash
        run: |
          npx electron-builder --win --x64 --publish never
          echo "Archivos generados:"
          find release -type f -ls || dir release /s

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: nova-codemind-exe
          path: |
            project/release/*.exe
            project/release/**/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Resumen
        shell: bash
        run: |
          echo "========================================"
          echo "  EXE generado correctamente"
          echo "========================================"
          echo "Descarga el artifact: nova-codemind-exe"
          echo "Archivos: CodeMind-Nova-Portable.exe + instalador"
          echo "========================================"
