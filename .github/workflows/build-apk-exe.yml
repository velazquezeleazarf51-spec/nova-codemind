# ============================================================
# CodeMind Nova - Build APK (Android) + EXE (Windows)
# ============================================================
# Este workflow:
# 1. Descomprime nova-codemind-completo-v2.zip
# 2. Construye el APK Android (debug)
# 3. Construye un .exe de Windows con Electron
# 4. Sube ambos archivos como artifacts descargables
#
# Cómo usarlo:
# - Ve a la pestaña "Actions" del repositorio
# - Ejecuta el workflow manualmente (workflow_dispatch)
# - O haz push a main
# ============================================================

name: Build APK + EXE

on:
  workflow_dispatch:          # Se puede ejecutar manualmente
  push:
    branches: [main]
    paths:
      - 'nova-codemind-completo-v2.zip'
      - '.github/workflows/build-apk-exe.yml'

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.18.0'
  # Cambia esta URL por tu backend desplegado si quieres que el APK/EXE
  # apunte directamente a internet (IA, chat, etc.)
  NOVA_REMOTE_URL: ''         # Ejemplo: 'https://tu-backend.railway.app'

jobs:
  # ----------------------------------------------------------
  # JOB 1: Construir APK Android
  # ----------------------------------------------------------
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          echo "Descomprimiendo nova-codemind-completo-v2.zip..."
          unzip -q nova-codemind-completo-v2.zip -d project
          ls -la project/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Java (para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        working-directory: project
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build del frontend + backend
        working-directory: project
        run: pnpm build

      - name: Sync Capacitor (Android)
        working-directory: project
        env:
          NOVA_REMOTE_URL: ${{ env.NOVA_REMOTE_URL }}
        run: |
          pnpm exec cap sync android
          echo "Capacitor sync completado"

      - name: Generar APK (debug)
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "APK generado:"
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-codemind-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # ----------------------------------------------------------
  # JOB 2: Construir EXE Windows (Electron)
  # ----------------------------------------------------------
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        shell: bash
        run: |
          echo "Descomprimiendo nova-codemind-completo-v2.zip..."
          unzip -q nova-codemind-completo-v2.zip -d project
          ls -la project/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar dependencias del proyecto
        working-directory: project
        shell: bash
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build estático del frontend
        working-directory: project
        shell: bash
        run: pnpm build:static || pnpm exec vite build

      - name: Crear wrapper Electron
        working-directory: project
        shell: bash
        run: |
          # Instalar Electron y electron-builder
          pnpm add -D electron electron-builder cross-env

          # Crear main.js de Electron (carga el frontend construido)
          cat > electron-main.js << 'EOF'
          const { app, BrowserWindow, shell } = require('electron');
          const path = require('path');

          // Permitir internet / CORS / recursos remotos
          app.commandLine.appendSwitch('disable-features', 'OutOfBlinkCors');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 900,
              minHeight: 600,
              title: 'CodeMind Nova',
              backgroundColor: '#070817',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: true,
                allowRunningInsecureContent: false,
              },
              autoHideMenuBar: true,
            });

            // Cargar el frontend construido
            const indexPath = path.join(__dirname, 'dist', 'public', 'index.html');
            win.loadFile(indexPath).catch(() => {
              // Fallback por si la estructura es distinta
              win.loadFile(path.join(__dirname, 'dist', 'index.html'));
            });

            // Abrir links externos en el navegador del sistema
            win.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url);
              return { action: 'deny' };
            });

            // DevTools opcional (comentar en producción)
            // win.webContents.openDevTools();
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });
          EOF

          # Crear package.json mínimo para electron-builder
          cat > electron-package.json << 'EOF'
          {
            "name": "codemind-nova",
            "version": "1.0.0",
            "description": "CodeMind Nova - Companion AI 3D",
            "main": "electron-main.js",
            "author": "CodeMind",
            "license": "MIT",
            "scripts": {
              "pack": "electron-builder --win --x64 --dir",
              "dist": "electron-builder --win --x64"
            },
            "build": {
              "appId": "com.codemind.nova",
              "productName": "CodeMind Nova",
              "directories": {
                "output": "release"
              },
              "files": [
                "electron-main.js",
                "dist/**/*",
                "package.json"
              ],
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": ["x64"]
                  },
                  {
                    "target": "portable",
                    "arch": ["x64"]
                  }
                ],
                "artifactName": "CodeMind-Nova-${version}-${arch}.${ext}"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true
              },
              "portable": {
                "artifactName": "CodeMind-Nova-Portable.exe"
              }
            }
          }
          EOF

          # Copiar package.json de electron sobre el original temporalmente
          cp package.json package.json.bak
          # Mantener las deps de electron
          node -e "
            const pkg = require('./package.json');
            const ePkg = require('./electron-package.json');
            pkg.main = ePkg.main;
            pkg.build = ePkg.build;
            pkg.scripts = { ...pkg.scripts, ...ePkg.scripts };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Construir .exe con electron-builder
        working-directory: project
        shell: bash
        run: |
          # Asegurar que existe la carpeta dist/public
          if [ ! -d "dist/public" ]; then
            echo "Buscando carpeta de build..."
            find dist -type d -maxdepth 2 || true
            # A veces vite pone todo en dist/
            if [ -f "dist/index.html" ]; then
              mkdir -p dist/public
              cp -r dist/* dist/public/ 2>/dev/null || true
            fi
          fi

          echo "Contenido de dist:"
          ls -la dist/ || true
          ls -la dist/public/ || true

          # Ejecutar electron-builder
          npx electron-builder --win --x64 --publish never

          echo "Archivos generados en release/:"
          find release -type f -ls || true

      - name: Subir EXE como artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-codemind-exe
          path: |
            project/release/*.exe
            project/release/**/*.exe
          retention-days: 14
          if-no-files-found: warn

  # ----------------------------------------------------------
  # JOB 3: Resumen final
  # ----------------------------------------------------------
  summary:
    name: Resumen
    runs-on: ubuntu-latest
    needs: [build-apk, build-exe]
    if: always()

    steps:
      - name: Resultado
        run: |
          echo "========================================"
          echo "  CodeMind Nova - Build terminado"
          echo "========================================"
          echo ""
          echo "Descarga los artifacts desde la pestaña Actions:"
          echo "  - nova-codemind-apk  → app-debug.apk"
          echo "  - nova-codemind-exe  → CodeMind-Nova-*.exe"
          echo ""
          echo "Notas importantes:"
          echo "  • El APK es de DEBUG (no firmado para Play Store)."
          echo "  • El EXE es portable / instalable."
          echo "  • Para que la IA funcione, configura NOVA_REMOTE_URL"
          echo "    con la URL de tu backend desplegado."
          echo "========================================"
