# ============================================================
# 2. Build APK Android
# ============================================================
# Descomprime el ZIP y genera el APK (debug).
# ============================================================

name: 2 - Build APK Android

on:
  workflow_dispatch:          # Ejecutar manualmente

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.18.0'
  # Pon aquí tu backend si quieres que el APK use internet/IA
  NOVA_REMOTE_URL: ''         # Ejemplo: 'https://tu-backend.railway.app'

jobs:
  build-apk:
    name: Generar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          echo "Descomprimiendo nova-codemind-completo-v2.zip..."
          unzip -q nova-codemind-completo-v2.zip -d project
          ls -la project/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        working-directory: project
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build del proyecto
        working-directory: project
        run: pnpm build

      - name: Sync Capacitor
        working-directory: project
        env:
          NOVA_REMOTE_URL: ${{ env.NOVA_REMOTE_URL }}
        run: pnpm exec cap sync android

      - name: Generar APK (debug)
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "APK generado:"
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-codemind-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Resumen
        run: |
          echo "========================================"
          echo "  APK generado correctamente"
          echo "========================================"
          echo "Descarga el artifact: nova-codemind-apk"
          echo "Archivo: app-debug.apk"
          echo "========================================"
