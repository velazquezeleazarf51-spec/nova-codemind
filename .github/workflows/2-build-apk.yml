# ============================================================
# 2. Build APK Android
# ============================================================
# Descomprime el ZIP y genera el APK (debug).
# ============================================================

name: 2 - Build APK Android

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.18.0'
  JAVA_VERSION: '17'
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  NOVA_REMOTE_URL: ''

jobs:
  build-apk:
    name: Generar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          echo "Descomprimiendo nova-codemind-completo-v2.zip..."
          unzip -q nova-codemind-completo-v2.zip -d project
          ls -la project/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Instalar Android command-line tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "Android cmdline-tools instalado"

      - name: Aceptar licencias e instalar SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Aceptar todas las licencias
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null 2>&1 || true

          # Instalar componentes necesarios
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK instalado en $ANDROID_HOME"
          ls -la $ANDROID_HOME/

      - name: Configurar variables de entorno Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Instalar dependencias del proyecto
        working-directory: project
        run: pnpm install --no-frozen-lockfile

      - name: Build del proyecto
        working-directory: project
        run: |
          pnpm build
          echo "=== dist/ ==="
          ls -la dist/ || true
          ls -la dist/public/ || true

      - name: Sync Capacitor
        working-directory: project
        env:
          NOVA_REMOTE_URL: ${{ env.NOVA_REMOTE_URL }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          pnpm exec cap sync android
          echo "Capacitor sync OK"

      - name: Generar APK (debug)
        working-directory: project/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== APK generado ==="
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-codemind-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Resumen
        run: |
          echo "========================================"
          echo "  APK generado correctamente"
          echo "========================================"
          echo "Descarga el artifact: nova-codemind-apk"
          echo "Archivo: app-debug.apk"
          echo "========================================"
